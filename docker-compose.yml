version: '3.8'

services:
  pilataxi-app:
    image: ghcr.io/padme2003/pilataxi:1.0.5
    container_name: pilataxi-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pilataxi.rule=Host(`pilataxi.byronrm.com`)"
      - "traefik.http.routers.pilataxi.entrypoints=websecure"
      - "traefik.http.routers.pilataxi.tls.certresolver=letsencrypt"
      - "traefik.http.services.pilataxi.loadbalancer.server.port=5000"
    networks:
      - traefik-network

networks:
  traefik-network:
    external: true
